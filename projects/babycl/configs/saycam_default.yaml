# Streaming BabyCL defaults; shared components also serve the offline variant.
#
# The original fixed its run length before training:
# 3321 offline-storyboard segments x 8 repeats = 26568 steps, with the
# LR schedule indexed by that count (warmup max(100, 2%) steps, cosine to 0).
# At that budget it had pushed 3751 segments (incl. the 406 of buffer warmup)
# and seen about 73% of SAYCam-S; the rest of the stream never trained.  The
# cap and the step-indexed schedule below reproduce that.  Drop both
# (driver.max_steps=null solver.schedule.total_steps=null) to train on the whole
# stream with the progress-driven schedule instead.
defaults:
  - saycam_shared
  - _self_

hydra:
  searchpath: [pkg://egolearn.configs]

solver:
  # total_steps equals driver.max_steps; change them together
  schedule: {warmup_frac: 0.02, warmup_min_steps: 100, floor: 0.0, total_steps: 26568}

driver:
  max_steps: 26568
  # Segment forwards use float16 autocast with a loss scaler. SupCon keeps its
  # similarities/log probabilities in float32, as does the cross-modal branch.
  amp: {dtype: float16, fp32_slots: [pairs]}
