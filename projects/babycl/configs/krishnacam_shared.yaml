# Visual-only BabyCL: silent recordings, native-rate video, chronological replay.
defaults:
  - /config
  - _self_

run_dir: ${oc.env:EGOLEARN_ARTIFACTS,runs}/babycl_krishnacam/seed_${seed}
seed: 0
device: cuda
_imports_: [egolearn.methods.babycl]

# All recordings in the supplied archive share this native frame rate.
source_fps: 29.923261998227176
stream:
  _target_: "stream:video"
  root_dir: ${oc.env:KRISHNACAM_ROOT,/path/to/krishnacam/kcam}
  manifest_json: ${oc.env:KRISHNACAM_MANIFEST,null}
  sessions: null
  decoder: {_target_: "decoder:pyav", device: cpu, cache_handles: 8, seek_gap: 64, threads: 1}

loader:
  workers: 8

views:
  ms_v1: {name: babycl_ms_aug, size: 224, view_idx: 0, scale_min: 0.2}
  ms_v2: {name: babycl_ms_aug, size: 224, view_idx: 1, scale_min: 0.2}
  eval: {name: center_crop, size: 224}

label_stores: [events]
embedders:
  cluster: {_target_: "embedder:frozen_resnext50", pretrained: true, view: eval}

admission:
  - {_target_: "admission:babycl_online_segmenter",
     fps: "${source_fps}", avg_minutes: 3.0, window_scale: 138,
     embed_stride: 360, compute_stride_frames: 60,
     seg_extend_min_sec: 2.0, seg_extend_max_sec: 12.0,
     global_merge_cos: 0.85, label_store: events, embedder: cluster}

# 69.2 hours / 3 minutes is about 1,384 segments: nominal 10%/50% capacities.
# Actual segment counts depend on similarity cuts and recording boundaries.
memories:
  segments:
    tiers:
      short: {capacity: 138, update: fifo}
      long: {capacity: 692, update: reservoir}
    admit_to: [short]
    overflow: {short: long}

routes:
  VisualSegment: segments

recipe:
  slots:
    - {name: segments,
       source: {kind: mix, memory: segments, fractions: {short: 0.25, long: 0.75}},
       n: 4, unit: segment, frames_per_item: 32,
       views: [ms_v1, ms_v2], labels_from: events, strict: true}

model:
  encoders:
    vision: {_target_: "encoder:resnext50", pretrained: false}
  heads:
    proj128: {encoder: vision, _target_: "head:mlp", sizes: [2048, 2048, 128]}
    segment128: {encoder: vision, _target_: "head:mlp", sizes: [2048, 2048, 128]}

losses:
  - {_target_: "loss:ntxent", name: instance,
     slots: [segments], head: proj128, temperature: 0.2, weight: 0.5}
  - {_target_: "loss:supcon", name: temporal,
     slots: [segments], head: segment128, temperature: 0.2, weight: 0.5}

solver:
  opt: adamw
  groups:
    - {match: "^encoders\\.vision\\.", lr: 1.0e-3,
       weight_decay: 1.0e-4, split_no_decay: true}
    - {match: ".*", lr: 1.0e-4, weight_decay: 1.0e-4}
  schedule: {warmup_frac: 0.02, warmup_min_steps: 100, floor: 0.0}

driver:
  advance: {kind: events, schema: VisualSegment, n: 1}
  rate: {steps_per_admit: 8, resample: true}
  warmup: {tier_full: segments.short}
  prefetch: true
  max_steps: null

hooks:
  log_every: 10
  checkpoint_every: 500
  snapshot_every: 500
  snapshot_milestones: [0.05, 0.25, 0.5, 1.0]
