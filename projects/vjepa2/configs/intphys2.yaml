defaults: [/evaluate, _self_]
hydra:
  searchpath: [pkg://egolearn.configs]
_imports_: [egolearn.methods.vjepa2, egolearn.evaluation.benchmarks.intphys2]
device: cuda
seed: 0
checkpoint: ???
benchmarks:
  - _target_: "probe:intphys2"
    name: intphys2
    data_root: ${oc.env:INTPHYS2_ROOT}
    context: video
    target: video_target
    predictor: pred
    num_frames: 16
    context_frames: [2, 4, 6, 8, 10, 12, 14]
    size: 128
    view: resize
    distance: l1
