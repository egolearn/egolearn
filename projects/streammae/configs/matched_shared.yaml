# Equal retained batch, source inventory, first update, and optimizer budget.
defaults:
  - mae_shared
  - full_run_shared
  - _self_
  - ablation: motion

_imports_: [egolearn.methods.streammae]
run_control:
  batch_size: 512
  window_size: ${run_control.batch_size}
  reference_window_size: 2048
  stride: 32
driver:
  advance: {kind: events, schema: RawFrame, n: '${run_control.stride}'}
  warmup: {admitted: 2016}  # reference_window_size - stride, including vanilla MAE
memories:
  frames:
    tiers:
      window: {capacity: '${run_control.window_size}', update: fifo}
recipe:
  slots:
    - name: frames
      source: {kind: tier, memory: frames, tier: window}
      n: ${run_control.batch_size}
      unit: frame
      views: [reconstruction]
      strict: true
