[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egolearn"
dynamic = ["version"]
description = "Learning from egocentric video streams: streaming SSL, continual learning, replay, memory, and video QA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "Agentic Learning AI Lab, New York University" }]
dependencies = [
    "hydra-core>=1.3",
    "numpy>=2",
    "huggingface-hub>=1.0",
]

[project.scripts]
egolearn = "egolearn.cli:main"
egl = "egolearn.cli:main"

[project.urls]
Homepage = "https://egolearn.org"
Documentation = "https://egolearn.org/docs/"
Repository = "https://github.com/egolearn/egolearn"
Issues = "https://github.com/egolearn/egolearn/issues"

# Optional extras are added together with the code that needs them (see docs/roadmap.md).
# Still planned:
#   eval  : scikit-learn                        (kNN/SVM readout)
[project.optional-dependencies]
video = ["pillow>=10", "av>=19"]
train = ["torch>=2.4", "torchvision>=0.19", "pillow>=10", "av>=19", "wandb>=0.18", "safetensors>=0.5"]
qa = ["openai>=1.40"]  # generative:openai_chat (served VLMs)
all = ["egolearn[video,train,qa]"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pre-commit>=4",
]
# Docs site (mkdocs.yml); Cloudflare Pages installs only this group.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.30,<1",
]

[tool.hatch.version]
path = "src/egolearn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/egolearn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]
# Lambdas and non-ternary ifs are fine in research code.
ignore = ["E731", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Verbatim 1:1 ports keep the original papers' code style untouched.
"src/egolearn/methods/babycl/refine.py" = ["E501", "E701", "E702", "E741"]
"src/egolearn/methods/storyboard/__init__.py" = ["E741"]

[tool.ruff.format]
exclude = ["src/egolearn/methods/babycl/refine.py"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

# Verbatim ports keep the original papers' code shape; typing them would
# mean rewriting verbatim algorithm bodies (same rationale as the ruff
# per-file-ignores).
[[tool.mypy.overrides]]
module = ["egolearn.methods.storyboard", "egolearn.methods.babycl.refine"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not gpu'"
markers = [
    "video: needs the video extra / real video files (small synthetic clips in CI)",
    "slow: long stream passes or full probes; nightly/manual only",
    "gpu: requires CUDA; cluster only, never CI",
    "llm: calls a paid LLM API; manual only, never CI",
]
