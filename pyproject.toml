[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egolearn"
dynamic = ["version"]
description = "Learning from egocentric video streams: streaming SSL, continual learning, replay, memory, and video QA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Agentic Learning AI Lab, New York University" }]
dependencies = [
    "hydra-core>=1.3",
    "numpy>=2",
]

# Optional extras are added together with the code that needs them (see docs/roadmap.md).
# Planned:
#   video : av, opencv-python-headless, pillow  (frame decoding + extraction)
#   train : torch, torchvision, wandb           (SSL training)
#   qa    : openai, anthropic, pandas           (LLM-based QA + memory)
#   eval  : scikit-learn                        (probes, kNN/SVM readout)
#   all   : union of the above

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8",
    "pre-commit>=4",
]

[tool.hatch.version]
path = "src/egolearn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/egolearn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]
# Lambdas and non-ternary ifs are fine in research code.
ignore = ["E731", "SIM108"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not gpu'"
markers = [
    "video: needs the video extra / real video files (small synthetic clips in CI)",
    "slow: long stream passes or full probes; nightly/manual only",
    "gpu: requires CUDA; cluster only, never CI",
    "llm: calls a paid LLM API; manual only, never CI",
]
