# Job names (lint, types, test, lock, gitleaks) are required-check contexts in
# branch protection — renaming a job requires updating scripts/setup_branch_protection.sh.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # train extra: mypy should see the real torch types, not Any stubs
      - run: uv sync --locked --extra train
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # train extra: the unit tests exercise the real pipelines, which need
      # torch (CPU is fine; the wheel is cached by setup-uv)
      - run: uv sync --locked --extra train
      # addopts in pyproject.toml already excludes the slow/gpu/llm tiers
      - run: uv run pytest

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check

  # Docs site (mkdocs.yml). Not a required check; --strict fails on broken
  # internal links and anchors.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --only-group docs
      - run: .venv/bin/mkdocs build --strict

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the full history, not just the PR diff — history goes public at release.
          fetch-depth: 0
      # Pinned CLI binary instead of gitleaks/gitleaks-action: the action requires a
      # paid GITLEAKS_LICENSE for organization repos; the CLI is free (MIT).
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
