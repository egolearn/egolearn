name: advisory-review
# The agent-session reviewer (reads the PR head read-only). Runs on PR
# open/reopen and the outerloop:review label (autoresearch:review still works), not every push.
# terra (hermes, openai-direct) is the sole advisory reviewer: the opus
# advisory job is sunset (2026-08-26) — terra converges where opus
# manufactured rounds, validated here as the second opinion and on the
# autoresearch arc. The wide lens round stays in autoresearch, where PR
# volume warrants it.
on:
  pull_request_target:
    types: [opened, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  advisory:
    # label events only run the review for the explicit re-request label
    if: github.event.action != 'labeled' || github.event.label.name == 'outerloop:review' || github.event.label.name == 'autoresearch:review'
    uses: outerloop-science/outerloop/.github/workflows/advisory-review-agent.yml@main
    with:
      bot_login: agentic-learning-bot
    secrets:
      openai_reviewer_key: ${{ secrets.OPENAI_REVIEWER_KEY }}
