name: advisory-review
# Advisory reviews run on same-repository PRs when opened, reopened, or labeled
# outerloop:review (autoresearch:review is also accepted). Update both SHA pins
# together after reviewing the upstream workflow and reviewer code.
on:
  pull_request_target:
    types: [opened, reopened, labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  advisory:
    # pull_request_target has base-repository secrets; fork PRs never enter this job.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'outerloop:review' ||
       github.event.label.name == 'autoresearch:review')
    uses: outerloop-science/outerloop/.github/workflows/advisory-review-agent.yml@679ca2961143caf6cf63bfe176f3c9b8b6a00b7c
    with:
      bot_login: agentic-learning-bot
      reviewer_ref: 679ca2961143caf6cf63bfe176f3c9b8b6a00b7c
      allow_labeled_forks: false
    secrets:
      openai_reviewer_key: ${{ secrets.OPENAI_REVIEWER_KEY }}
