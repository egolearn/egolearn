# Novel-object shape bias (Tartaglini, Vong & Lake, 2022) on hosted stimuli.
# CC BY 4.0; cite the paper. Private until release: authenticate with HF_TOKEN.
#   egl eval shape_bias_eval checkpoint=<checkpoint or export>
defaults:
  - evaluate
  - _self_

_imports_:
  - egolearn.evaluation.benchmarks.shape_bias
benchmarks:
  - _target_: "probe:shape_bias"
    name: shape_bias
    manifest: "hf://datasets/egolearn/shape-bias@v1/stimulus_manifest.json"
    batch_size: 32
    view: resize
    size: 224
